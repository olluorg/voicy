# Запуск voicy без выкачивания репозитория:
#
#   curl -O https://raw.githubusercontent.com/olluorg/voicy/master/compose.yml
#   docker compose up -d
#
# Консоль — http://localhost:8080, API — http://localhost:8080/v1
#
# Первый запуск скачивает веса моделей (~8 ГБ) в том `models`; дальше они берутся
# оттуда. Пока идёт загрузка, сервер ещё не отвечает: ход её — docker compose logs -f.
#
# Нужен драйвер NVIDIA с CUDA 13 (580 и новее) и NVIDIA Container Toolkit. Без
# видеокарты — FORCE_CPU ниже и убрать блок deploy: работает, но медленно.

services:
  voicy:
    image: ghcr.io/olluorg/voicy:latest
    # чтобы собрать из исходников вместо готового образа, раскомментируйте:
    # build: .
    container_name: voicy
    restart: unless-stopped
    ports:
      - "${VOICY_PORT:-8080}:8080"
    volumes:
      - models:/cache          # веса Qwen3-TTS, Whisper и RUAccent
      - voices:/app/server/voices
      - contexts:/app/server/contexts   # профили контекста распознавания
    environment:
      # зеркало Hugging Face помогает, когда загрузка идёт медленно
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      # ключ доступа к /v1/: без него сервер открыт всем, кто видит порт
      VOICY_API_KEY: ${VOICY_API_KEY:-}
      # адрес снаружи, если сервер за обратным прокси: https://example.com/voicy
      VOICY_PUBLIC_URL: ${VOICY_PUBLIC_URL:-}
      # FORCE_CPU: "1"        # запустить без GPU (медленно, но работает)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  models:
  voices:
  contexts:

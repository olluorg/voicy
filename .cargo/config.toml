# Настройка лежит в корне, а не в rust/: cargo ищет её от текущего каталога
# вверх, и при сборке из корня (cargo build --manifest-path rust/Cargo.toml)
# файл внутри rust/ не читается — CI на этом падал.
#
# libopus, который собирается из исходников для кодирования opus, объявляет
# совместимость с CMake 3.1, а CMake 4 такие файлы больше не принимает.
# Переменная просит его вести себя как раньше; на старых CMake она безвредна.
[env]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"

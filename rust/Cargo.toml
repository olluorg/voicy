[package]
name = "voicy"
version = "1.6.0"
edition = "2024"
description = "Local speech server with an OpenAI-compatible audio API"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
audiopus_sys = { version = "0.2", features = ["static"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
fancy-regex = "0.19"
flacenc = "0.5.1"
flate2 = "1.1.10"
fst = "0.4"
futures = "0.3"
half = "2"
hex = "0.4"
hmac = "0.12"
libloading = "0.9"
matrixmultiply = "0.3"
memmap2 = "0.9"
mp3lame-encoder = "0.2.5"
ogg = "0.9.2"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-24", "half", "cuda"] }
realfft = "3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
sha2 = "0.10"
soxr-sys = "0.1"
symphonia = { version = "0.5", features = ["all"] }
tar = "0.4.46"
tempfile = "3"
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs", "catch-panic"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
codegen-units = 4

name: статья

on:
  push:
    branches: [master, main]
    paths:
      - "article/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# один деплой за раз; отменять идущий не нужно — он быстрый
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать сайт
        run: |
          mkdir -p _site
          cp -r article/* _site/
          # статья ссылается на ADR через ../docs — кладём их рядом и правим путь,
          # иначе на Pages ссылка ведёт за пределы сайта
          mkdir -p _site/docs
          cp -r docs/* _site/docs/
          sed -i 's|href="\.\./docs/|href="docs/|g' _site/index.html
          echo "страниц: $(find _site -name '*.html' | wc -l), аудио: $(find _site -name '*.opus' | wc -l)"

      - name: Проверить, что ссылки на аудио живые
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          # все страницы сайта: пути к звуку ищутся и в атрибутах, и в данных для скриптов
          # (страница stress/ подставляет звук из JSON), и проверяются от каталога страницы
          bad, n_audio, n_docs = [], 0, 0
          for page in pathlib.Path("_site").rglob("*.html"):
              if "docs" in page.relative_to("_site").parts:
                  continue
              html = page.read_text(encoding="utf-8")
              audio = set(re.findall(r'((?:\.\./)*assets/audio/[^"\\\s]+\.opus)', html))
              docs = set(re.findall(r'href="((?:\.\./)*docs/[^"#]+)"', html))
              n_audio += len(audio); n_docs += len(docs)
              bad += [f"{page}: {p}" for p in sorted(audio | docs) if not (page.parent / p).exists()]
          print(f"ссылок на аудио: {n_audio}, на документы: {n_docs}, битых: {len(bad)}")
          if bad:
              print("\n".join(bad[:20])); sys.exit(1)
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

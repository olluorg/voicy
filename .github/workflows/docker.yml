name: образ

on:
  push:
    branches: [master, main]
    tags: ["v*"]
    # статья и замеры в образ не едут — пересобирать из-за них нечего
    paths-ignore:
      - "article/**"
      - "docs/**"
      - "experiments/**"
      - "results/**"
      - "scripts/**"
      - "tests/**"
      # образ — бинарник на Rust; Python-сервер в него не входит
      - "server/**"
      - "**/*.md"
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Проверить словарь произношений
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("rust/core/assets/pronunciation.json", encoding="utf-8"))
          terms = d["terms"]
          missing = [k for k, v in terms.items() if not v.get("say")]
          print(f"терминов: {len(terms)}, подтверждено: {sum(1 for v in terms.values() if v.get('verified'))}")
          if missing:
              print("без произношения:", missing); sys.exit(1)
          PY

      - uses: docker/setup-buildx-action@v3

      - name: Войти в реестр
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Метки и теги
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=voicy
            org.opencontainers.image.description=Локальный речевой сервер с OpenAI-совместимым API
            org.opencontainers.image.licenses=MIT

      # Сначала собрать и проверить, потом выкладывать: вторая сборка берёт всё из кэша
      - name: Собрать
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: voicy:check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Моделей в CI нет, и качать их ради проверки — восемь гигабайт; проверяется
      # то, что образ приносит сам: бинарник, библиотеки движков, голоса
      - name: Проверить образ
        run: |
          docker run --rm voicy:check voicy --version
          docker run --rm voicy:check sh -c '
            set -e
            cd /opt/voicy/lib
            ls libct2shim.so libllama.so libonnxruntime.so libcudart.so.13 libcudnn.so.9 >/dev/null
            cat voicy-libs.txt
            ls /app/server/voices/turgenev.wav /app/server/voices/voices.json >/dev/null
            ldd /usr/local/bin/voicy libct2shim.so | grep "not found" && exit 1 || true
            echo образ на месте'

      - name: Опубликовать
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Итог
        if: github.event_name != 'pull_request'
        run: |
          echo "### Образ опубликован" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker run --gpus all -p 8080:8080 -v voicy-models:/cache ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

name: образ

on:
  push:
    branches: [master, main]
    tags: ["v*"]
    # статья и замеры в образ не едут — пересобирать из-за них нечего
    paths-ignore:
      - "article/**"
      - "docs/**"
      - "experiments/**"
      - "results/**"
      - "scripts/**"
      - "**/*.md"
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Проверить, что сервер импортируется
        run: |
          python -m pip install --quiet fastapi pydantic
          python - <<'PY'
          import ast, pathlib, sys
          bad = []
          for p in pathlib.Path("server").rglob("*.py"):
              try:
                  ast.parse(p.read_text(encoding="utf-8"))
              except SyntaxError as e:
                  bad.append(f"{p}: {e}")
          print(f"проверено файлов: {len(list(pathlib.Path('server').rglob('*.py')))}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          PY

      - name: Проверить словарь произношений
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("data/pronunciation.json", encoding="utf-8"))
          terms = d["terms"]
          missing = [k for k, v in terms.items() if not v.get("say")]
          print(f"терминов: {len(terms)}, подтверждено: {sum(1 for v in terms.values() if v.get('verified'))}")
          if missing:
              print("без произношения:", missing); sys.exit(1)
          PY

      - uses: docker/setup-buildx-action@v3

      - name: Войти в реестр
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Метки и теги
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=voicy
            org.opencontainers.image.description=Локальный речевой сервер с OpenAI-совместимым API
            org.opencontainers.image.licenses=MIT

      - name: Собрать и опубликовать
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Итог
        if: github.event_name != 'pull_request'
        run: |
          echo "### Образ опубликован" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker run --gpus all -p 8080:8080 -v voicy-models:/cache ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

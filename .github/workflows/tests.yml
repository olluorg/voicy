name: проверки

# Набор проверок API с учебными движками (tests/): без моделей и видеокарты,
# на всех целевых системах. Отчёт каждой платформы — в артефактах прогона.

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "article/**"
      - "docs/**"
      - "experiments/**"
      - "results/**"
      - "**/*.md"
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  api:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Windows ARM64: у soxr нет готового колеса под cp312 — собирается из исходников,
    # и пока это не проверено, сбой здесь виден, но прогон не валит.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,     os: ubuntu-24.04,       experimental: false }
          - { name: linux-arm64,   os: ubuntu-24.04-arm,   experimental: false }
          - { name: windows-x64,   os: windows-2025,       experimental: false }
          - { name: windows-arm64, os: windows-11-arm,     experimental: true }
          - { name: macos-arm64,   os: macos-15,           experimental: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: зависимости
        run: python -m pip install -r tests/requirements.txt
      - name: проверки
        run: python -m tests --report report-${{ matrix.name }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.name }}
          path: report-${{ matrix.name }}.json
          if-no-files-found: ignore

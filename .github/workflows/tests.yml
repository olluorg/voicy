name: проверки

# Сборка сервера на Rust и набор проверок API против него (tests/) с учебными
# движками: без моделей и видеокарты, на всех целевых системах. Отчёт каждой
# платформы — в артефактах прогона.

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "article/**"
      - "docs/**"
      - "experiments/**"
      - "results/**"
      - "**/*.md"
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  api:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Бинарник проверен на Linux x86-64 и Windows x86-64; на ARM64 и macOS его
    # сборка ещё не отлажена (ADR 0022, шаг 7) — сбой там виден, но прогон не валит.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,     os: ubuntu-24.04,       experimental: false }
          - { name: windows-x64,   os: windows-2025,       experimental: false }
          - { name: linux-arm64,   os: ubuntu-24.04-arm,   experimental: true }
          - { name: windows-arm64, os: windows-11-arm,     experimental: true }
          - { name: macos-arm64,   os: macos-15,           experimental: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Учебные движки — на Python: сервер на Rust поднимает их дочерним процессом
      - name: зависимости
        run: python -m pip install -r tests/requirements.txt
      - name: сборка
        run: cargo build --release --manifest-path rust/Cargo.toml
      - name: свои проверки
        run: cargo test --release --manifest-path rust/Cargo.toml
      # Крейт движков собирается из своего пакета, без остального репозитория:
      # так видно, если что-то снова потянулось за его пределы. На Windows это
      # заодно сборка ct2shim.dll (rust/core/build.rs)
      - name: пакет voicy-core
        run: cargo package -p voicy-core --manifest-path rust/Cargo.toml
      - name: проверки API
        run: python -m tests --report report-${{ matrix.name }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.name }}
          path: report-${{ matrix.name }}.json
          if-no-files-found: ignore
